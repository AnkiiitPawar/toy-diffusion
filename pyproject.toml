[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toy-diffusion"
version = "0.1.0"
description = "DDPM and DDIM diffusion models on 2-D data in NumPy"
authors = [{ name = "Ankit Pawar" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["diffusion"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
